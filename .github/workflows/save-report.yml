name: Save LPIA report
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  save:
    if: github.event.issue.title == 'LPIA Academic Report'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate, save and verify the CSV row
        run: node .github/scripts/save-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
